name: '[dev] Deploy qubetcs indexer service'

on: 
  push:
    branches: 
      - v2-indexer-evm

jobs:
  dev_deploy_qubetics_indexer_service:
    uses: ./.github/workflows/qubetics-indexer-service.yaml
    with:
      SWR_ORGANIZATION: dev-qubetics
      ARGOCD_BRANCH: dev
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Indexer/indexer-deployment.yaml
      HUAWEI_IMAGE: dev-qubetics-indexer
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.DEV_QUBETICS_INDEXER_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_TESTNET }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
