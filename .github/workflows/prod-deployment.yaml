name: '[prod] Deploy qubetics indexer'

on: 
  push:
    branches: 
      - master

jobs:
  deploy_qubetics_indexer:
    uses: Qubetics/argocd-qubetics/.github/workflows/deployment.yaml@prod
    with:
      SWR_ORGANIZATION: prod-qubetics
      ARGOCD_BRANCH: prod
      HUAWEI_REGION: 'ap-southeast-1'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Indexer/qubetics-indexer-deployment.yaml
      HUAWEI_IMAGE: prod-qubetics-indexer-service
      DOCKER_USERNAME: ap-southeast-1@${{ vars.DOCKER_USERNAME_V2 }}
      ENV: ${{ vars.PROD_QUBETICS_INDEXER_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_V2 }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY_NEW }}
