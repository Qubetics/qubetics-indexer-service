name: '[prod] Deploy qubetics indexer'

on: 
  push:
    branches: 
      - testnet

jobs:
  deploy_qubetics_indexer:
    uses: ./.github/workflows/testnet-evm-indexer-service.yaml
    with:
      SWR_ORGANIZATION: testnet-qubetics
      ARGOCD_BRANCH: testnet_v2
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Indexer/qubetics-indexer-deployment.yaml
      HUAWEI_IMAGE: testnet-qubetics-indexer
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.PROD_QUBETICS_INDEXER_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
